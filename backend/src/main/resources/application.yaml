spring:
  application:
    name: eventflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventflow}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

eventflow:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@eventflow.local}
    application-base-url: ${APP_BASE_URL:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}
